# Statically link the MSVC C runtime so Windows executables start on machines
# without the Visual C++ Redistributable (VCRUNTIME140.dll).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
