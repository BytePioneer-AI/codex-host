# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Requires the CodeRabbit GitHub App to be authorized for this repository.
# Subscription entitlements and billing are managed separately in CodeRabbit.
language: zh-CN

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary_in_walkthrough: true
  review_details: true
  poem: false
  auto_review:
    # Review non-draft PRs targeting the default branch (main).
    enabled: true
    drafts: false
    auto_incremental_review: true
    # After pausing, use @coderabbitai review or @coderabbitai resume.
    auto_pause_after_reviewed_commits: 5
  pre_merge_checks:
    # The repository does not require a minimum docstring coverage percentage.
    docstrings:
      mode: "off"

knowledge_base:
  code_guidelines:
    # Reuse the auto-detected AGENTS.md instead of duplicating repository rules.
    enabled: true
