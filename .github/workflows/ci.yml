name: CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to check
        type: choice
        default: all
        options:
          - all
          - ubuntu-22.04
          - macos-26
          - windows-latest
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main

permissions:
  contents: read

# Cold CI builds skip incremental state and debug symbols, retaining debug assertions.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# Superseded PR runs are disposable; main runs provide per-commit release evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ubuntu-22.04'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Rust formatting belongs to the native lane, which installs Rust.
      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  vitest:
    name: Vitest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ubuntu-22.04'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build TypeScript
        run: npm run build:typescript

      - name: Test Vitest (full suite)
        run: npx vitest run --config tests/vitest.config.js

  web:
    name: Web Host tests
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ubuntu-22.04'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build TypeScript
        run: npm run build:typescript

      # test:web's pretest builds the Web UI assets used by these suites.
      - name: Test Web Host (full suite)
        run: npm run test:web

  # Release and repository maintenance require these existing Check job names.
  # Linux x64 owns native checks here; secondary OS lanes also test OS-sensitive TS.
  check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-22.04","macos-26","windows-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      # Reuse compiled dependencies; only main refreshes the cache so PRs cannot evict it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        id: dependencies
        run: npm ci --prefer-offline

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Linux x64 covers governance, browser/contracts, and the nested Gate runner test.
      # Secondary OS lanes filter both Vitest and Web Host files (tests/platform-tests.mjs);
      # Linux x64 covers platform-independent logic.
      - name: Test TypeScript (cross-platform)
        if: runner.os != 'Linux'
        env:
          CODEXHOST_TEST_SCOPE: platform
        run: >
          npm run build:typescript &&
          npx vitest run --config tests/vitest.config.js
          --exclude 'packages/repository-automation/test/**'
          --exclude 'packages/shared-contracts/test/**'
          --exclude 'packages/renderer-extension/test/**'
          --exclude 'tools/gate-claude-code/run.test.mjs'
          && npm run test:web

      # Real Launcher + Node service, with isolated HOME/data and fake Harnesses.
      - name: Test independent Host lifecycle
        run: npm run test:shared-host

      - name: Test Unix Desktop Controller recovery
        if: runner.os != 'Windows'
        run: |
          export CODEXHOST_TEST_CONTROLLER_BUNDLE="$RUNNER_TEMP/desktop-controller.mjs"
          npm run build:release -w @codexhost/desktop-control -- --output "$CODEXHOST_TEST_CONTROLLER_BUNDLE"
          cargo test -p codexhost-launcher --locked --bin codexhost -- recovers_release_controller --ignored

      # Rust formatting is already covered by the Linux x64 formatting step.
      - name: Check Rust
        run: >
          cargo clippy --workspace --all-targets --locked
          --features codexhost-shim/test-utils,codexhost-gate-a-native/gate-tools
          -- -D warnings && npm run test:rust

      - name: Setup cargo-zigbuild
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.dependencies.outcome == 'success' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary :all: -r scripts/release/linux-zigbuild-requirements.txt
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"

      # Keep packaging evidence even when an unrelated check fails; reuse this runner.
      - name: Smoke-test Linux npm package
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.dependencies.outcome == 'success' }}
        run: |
          npm run build:typescript
          node scripts/release/smoke-npm-package.mjs --target linux-x64 --version 0.1.6-ci.0

  check-linux-arm64:
    name: Check Linux ARM64
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      # Reuse compiled dependencies; only main refreshes the cache so PRs cannot evict it.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        id: dependencies
        run: npm ci --prefer-offline

      # Linux x64 owns TS tests; ARM64 verifies native code and the installed package.
      - name: Test independent Host lifecycle
        run: npm run test:shared-host

      - name: Check Rust
        run: >
          cargo clippy --workspace --all-targets --locked
          --features codexhost-shim/test-utils,codexhost-gate-a-native/gate-tools
          -- -D warnings && npm run test:rust

      - name: Setup cargo-zigbuild
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary :all: -r scripts/release/linux-zigbuild-requirements.txt
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"

      - name: Smoke-test Linux ARM64 npm package
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm run build:typescript
          node scripts/release/smoke-npm-package.mjs --target linux-arm64 --version 0.1.6-ci.0

  windows-fix-preview:
    name: Build Windows fix preview
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Setup Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: npm ci

      - name: Test Windows npm staging
        run: cargo test -p codexhost-updater --locked

      - name: Test explicit Windows npm Node selection
        run: cargo test -p codexhost-launcher --bin codexhost --locked npm_node_is_shared_with_host_when_launch_options_omit_node

      - name: Test desktop shell initialization
        run: cargo test --manifest-path apps/desktop-shell/src-tauri/Cargo.toml --locked installs_bridge_before_document_element_is_available

      - name: Build TypeScript prerequisites
        run: npm run build:typescript

      - name: Build Windows fix preview
        run: npm run release:package -- --target windows-x64

      - name: Upload Windows fix preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codexhost-fix-preview-windows-x64
          path: build/release/*/windows-x64/codexhost-*-windows-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload fixed native executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codexhost-fixed-native-windows-x64
          path: |
            build/release/*/windows-x64/payload/bin/codexhost.exe
            build/release/*/windows-x64/payload/libexec/codexhost-shell.exe
            build/release/*/windows-x64/payload/libexec/codexhost-updater.exe
          if-no-files-found: error
          retention-days: 7
