name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Smoke-test Linux npm package
        if: runner.os == 'Linux'
        run: >
          node scripts/release/smoke-npm-package.mjs
          --target linux-x64
          --version 0.1.6-ci.0
