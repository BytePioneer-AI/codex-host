name: Repository maintenance

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: "PR number; empty processes all open PRs"
        required: false
        type: string
      dry_run:
        description: "Preview only; do not change labels or comments"
        default: true
        type: boolean

# Serialize the single CI comment writer. No scheduled Issue/PR backlog reminders.
concurrency:
  group: repository-maintenance
  cancel-in-progress: false

permissions: {}

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      # Never checkout or execute the PR head. Titles and CI logs are data only.
      - name: Checkout trusted automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: packages/repository-automation

      - name: Sync explicit PR labels and completed CI result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ITEM_NUMBER: ${{ inputs.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { resolve } = await import('node:path');
            const { runMaintenance } = await import(pathToFileURL(resolve('packages/repository-automation/index.mjs')).href);
            await runMaintenance({
              github, context, core,
              number: process.env.ITEM_NUMBER,
              dryRun: process.env.DRY_RUN === 'true',
            });
