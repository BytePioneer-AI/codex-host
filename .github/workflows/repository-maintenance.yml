name: Repository maintenance

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  status:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      number:
        description: "Issue / PR number; empty refreshes all open items"
        required: false
        type: string
      dry_run:
        description: "Preview only; do not change labels or comments"
        default: true
        type: boolean

# One writer across event refreshes and scheduled sweeps. GitHub can replace a
# pending run; the six-hour sweep reconciles missed events from live API data.
concurrency:
  group: repository-maintenance
  cancel-in-progress: false

permissions: {}

jobs:
  maintain:
    if: >-
      (github.event_name != 'issue_comment' || github.event.comment.user.login != 'github-actions[bot]') &&
      (github.event_name != 'status' ||
        (github.event.context == 'CodeRabbit' && github.event.sender.login == 'coderabbitai[bot]' && github.event.sender.id == 136622811))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      # Never checkout, install dependencies from, or execute the PR head.
      # Issues, comments, diffs and review text are data, never shell/program input.
      - name: Checkout trusted automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: packages/repository-automation

      - name: Refresh labels and maintenance summaries
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ITEM_NUMBER: ${{ inputs.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { resolve } = await import('node:path');
            const { runMaintenance } = await import(pathToFileURL(resolve('packages/repository-automation/index.mjs')).href);
            await runMaintenance({
              github, context, core,
              number: process.env.ITEM_NUMBER,
              dryRun: process.env.DRY_RUN === 'true',
            });
