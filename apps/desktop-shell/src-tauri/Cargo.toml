[package]
name = "codexhost-shell"
version = "0.28.2"
edition = "2024"
rust-version = "1.97.1"
publish = false

[package.metadata.tauri-winres]
OriginalFilename = "codexhost-shell.exe"
InternalName = "codexhost-shell"

[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
cc = "1"
tauri-build = "2"

[dependencies]
codexhost-platform = { path = "../../../crates/platform" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["gtk3"] }
tauri-plugin-notification = "2"
tempfile = "3"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
winreg = "0.56"
