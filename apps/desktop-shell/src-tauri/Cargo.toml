[package]
name = "codexhost-shell"
version = "0.27.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
codexhost-platform = { path = "../../../crates/platform" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["gtk3"] }
tempfile = "3"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
