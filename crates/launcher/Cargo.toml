[package]
name = "codexhost-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "codexhost"
path = "src/main.rs"

[[bin]]
name = "codexhost-start"
path = "src/start_menu.rs"

[dependencies]
codexhost-platform = { path = "../platform" }
fs2 = "0.4.3"
getrandom = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["fs"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
