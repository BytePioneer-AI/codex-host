<svg xmlns="http://www.w3.org/2000/svg" width="76" height="20" role="img" aria-label="Hermes">
  <title>Hermes</title>
  <defs>
    <linearGradient id="hermes-badge-shade" x2="0" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".08" />
      <stop offset="1" stop-opacity=".08" />
    </linearGradient>
    <clipPath id="hermes-badge-clip"><rect width="76" height="20" rx="3" /></clipPath>
    <clipPath id="hermes-avatar-clip"><circle cx="11" cy="10" r="7" /></clipPath>
  </defs>
  <g clip-path="url(#hermes-badge-clip)">
    <rect width="76" height="20" fill="#0000A8" />
    <rect width="76" height="20" fill="url(#hermes-badge-shade)" />
    <image x="4" y="3" width="14" height="14" preserveAspectRatio="xMidYMid slice" clip-path="url(#hermes-avatar-clip)" href="data:image/png;base64," />
    <text x="23" y="14" fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">Hermes</text>
  </g>
</svg>
