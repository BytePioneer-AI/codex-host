<svg xmlns="http://www.w3.org/2000/svg" width="87" height="20" role="img" aria-label="OpenCode">
  <title>OpenCode</title>
  <defs>
    <linearGradient id="opencode-badge-shade" x2="0" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".08" />
      <stop offset="1" stop-opacity=".08" />
    </linearGradient>
    <clipPath id="opencode-badge-clip">
      <rect width="87" height="20" rx="3" />
    </clipPath>
  </defs>
  <g clip-path="url(#opencode-badge-clip)">
    <rect width="87" height="20" fill="#211e1e" />
    <rect width="87" height="20" fill="url(#opencode-badge-shade)" />
    <rect x="6" y="3" width="12" height="14" fill="#fff" />
    <rect x="9" y="6" width="6" height="4" fill="#131010" />
    <rect x="9" y="10" width="6" height="6" fill="#5a5858" />
    <text x="22" y="14" fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">OpenCode</text>
  </g>
</svg>
