  </defs>
  <g clip-path="url(#opencode-badge-clip)">
    <rect width="20" height="20" fill="#211e1e" />
    <rect width="20" height="20" fill="url(#opencode-badge-shade)" />
    <rect x="4" y="3" width="12" height="14" fill="#fff" />
    <rect x="7" y="6" width="6" height="4" fill="#131010" />
    <rect x="7" y="10" width="6" height="6" fill="#5a5858" />
  </g>
