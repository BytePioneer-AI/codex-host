    <text x="480" y="304" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4">原生执行与多机互联</text>

    <!-- Connection paths -->
    
    <path id="p1" d="M 177 132 C 177 160, 330 152, 330 178" fill="none" stroke="rgba(15, 23, 42, 0.22)" stroke-width="1.6"/>
