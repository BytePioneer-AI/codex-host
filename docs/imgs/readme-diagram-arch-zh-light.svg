      <text x="480" y="209" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">本地共享 Host（唯一真相源）</text>
