    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
  </defs>
  <rect width="960" height="430" rx="18" fill="url(#bgGrad)"/>
  <rect width="960" height="430" rx="18" fill="url(#dotGrid)"/>
  <rect x="0.75" y="0.75" width="958.5" height="428.5" rx="17.25" fill="none" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1.2"/>
  
