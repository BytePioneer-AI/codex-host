<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Multi-Machine Mesh &amp;amp; Mobile Control Topology">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1320"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2928"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148, 163, 184, 0.06)"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="hubShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#14b8a6" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
  </defs>
  <rect width="960" height="330" rx="18" fill="url(#bgGrad)"/>
  <rect width="960" height="330" rx="18" fill="url(#dotGrid)"/>
  <rect x="0.75" y="0.75" width="958.5" height="328.5" rx="17.25" fill="none" stroke="rgba(148, 163, 184, 0.16)" stroke-width="1.2"/>
  
    <!-- Group box around machines -->
    <rect x="26" y="24" width="284" height="288" rx="14" fill="rgba(15, 23, 42, 0.55)" stroke="rgba(148, 163, 184, 0.16)" stroke-width="1.2"/>
    <text x="168" y="47" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">MULTI-MACHINE MESH · CROSS-NODE DELEGATION</text>

    
    <!-- Mesh inter-links on left -->
    <path id="m12" d="M 68 128 L 68 146" fill="none" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path id="m23" d="M 68 212 L 68 230" fill="none" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="4 3"/>

    <!-- Nodes to Unified Hub -->
    <path id="mh1" d="M 292 95 C 337 95, 345 154, 390 154" fill="none" stroke="rgba(148, 163, 184, 0.34)" stroke-width="1.6"/>
    <path id="mh2" d="M 292 179 L 390 177" fill="none" stroke="rgba(148, 163, 184, 0.34)" stroke-width="1.6"/>
    <path id="mh3" d="M 292 263 C 337 263, 345 200, 390 200" fill="none" stroke="rgba(148, 163, 184, 0.34)" stroke-width="1.6"/>

    <!-- Hub to Mobile -->
    <path id="hm1" d="M 606 169 L 700 169" fill="none" stroke="#2dd4bf" stroke-width="1.8"/>
    <path id="hm2" d="M 700 185 L 606 185" fill="none" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.8"/>
  
    <circle r="3.5" fill="#2dd4bf" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mh1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
    <circle r="3.5" fill="#60a5fa" filter="url(#glow)">
    <animateMotion dur="2.0s" begin="0.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mh2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.0s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
    <circle r="3.5" fill="#fbbf24" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="1.0s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mh3"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.2s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
    <circle r="3.8" fill="#2dd4bf" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="0.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#hm1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
    <circle r="3.8" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite" rotate="auto">
      <mpath href="#hm2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
  </circle>

    
    <g filter="url(#cardShadow)">
      <rect x="44" y="62" width="248" height="66" rx="12" fill="#111827" stroke="rgba(148, 163, 184, 0.22)" stroke-width="1.2"/>
      <g>
    <circle cx="68" cy="95" r="4" fill="#2dd4bf"/>
    <circle cx="68" cy="95" r="4" fill="none" stroke="#2dd4bf" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
      <text x="88" y="91" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600">MacBook Pro</text>
      <text x="88" y="111" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12">Local workspace &amp; lead</text>
    </g>
  

    <g filter="url(#cardShadow)">
      <rect x="44" y="146" width="248" height="66" rx="12" fill="#111827" stroke="rgba(148, 163, 184, 0.22)" stroke-width="1.2"/>
      <g>
    <circle cx="68" cy="179" r="4" fill="#60a5fa"/>
    <circle cx="68" cy="179" r="4" fill="none" stroke="#60a5fa" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
      <text x="88" y="175" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600">Linux Dev Box</text>
      <text x="88" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12">Remote build &amp; compute</text>
    </g>
  

    <g filter="url(#cardShadow)">
      <rect x="44" y="230" width="248" height="66" rx="12" fill="#111827" stroke="rgba(148, 163, 184, 0.22)" stroke-width="1.2"/>
      <g>
    <circle cx="68" cy="263" r="4" fill="#fbbf24"/>
    <circle cx="68" cy="263" r="4" fill="none" stroke="#fbbf24" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
      <text x="88" y="259" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600">Windows Rig</text>
      <text x="88" y="279" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12">Test &amp; verification node</text>
    </g>
  

    <!-- Unified Sidebar Hub -->
    <g filter="url(#hubShadow)">
      <rect x="390" y="128" width="216" height="98" rx="15" fill="url(#hubGrad)" stroke="#14b8a6" stroke-width="1.6"/>
      <text x="498" y="170" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="700">Unified Sidebar</text>
      <text x="498" y="194" text-anchor="middle" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12.5">Cross-machine invocation</text>
    </g>

    <!-- Network badge below link -->
    <rect x="524" y="250" width="256" height="28" rx="14" fill="rgba(20, 184, 166, 0.14)" stroke="rgba(45, 212, 191, 0.32)" stroke-width="1"/>
    <text x="652" y="268" text-anchor="middle" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">LAN / Tailscale / Encrypted Relay</text>

    <!-- Mobile / Any Browser -->
    <g filter="url(#cardShadow)">
      <rect x="700" y="128" width="216" height="98" rx="15" fill="#111827" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/>
      <g>
    <circle cx="726" cy="158" r="4" fill="#a78bfa"/>
    <circle cx="726" cy="158" r="4" fill="none" stroke="#a78bfa" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>
      <text x="814" y="170" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="700">Phone / Any Browser</text>
      <text x="808" y="194" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12.5">Approve · Steer · Hand off</text>
    </g>
  
</svg>
