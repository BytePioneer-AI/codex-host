<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="多机互联与手机随时掌控拓扑">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(15, 23, 42, 0.045)"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="hubShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
  </defs>
  <rect width="960" height="330" rx="18" fill="url(#bgGrad)"/>
  <rect width="960" height="330" rx="18" fill="url(#dotGrid)"/>
  <rect x="0.75" y="0.75" width="958.5" height="328.5" rx="17.25" fill="none" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1.2"/>
  
    <!-- Group box around machines -->
    <rect x="26" y="24" width="284" height="288" rx="14" fill="rgba(241, 245, 249, 0.72)" stroke="rgba(15, 23, 42, 0.1)" stroke-width="1.2"/>
    <text x="168" y="47" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">多机互联 · 跨节点互相派活</text>

    
    <!-- Mesh inter-links on left -->
    <path id="m12" d="M 68 128 L 68 146" fill="none" stroke="#0d9488" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path id="m23" d="M 68 212 L 68 230" fill="none" stroke="#0d9488" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="4 3"/>

    <!-- Nodes to Unified Hub -->
    <path id="mh1" d="M 292 95 C 337 95, 345 154, 390 154" fill="none" stroke="rgba(15, 23, 42, 0.22)" stroke-width="1.6"/>
    <path id="mh2" d="M 292 179 L 390 177" fill="none" stroke="rgba(15, 23, 42, 0.22)" stroke-width="1.6"/>
    <path id="mh3" d="M 292 263 C 337 263, 345 200, 390 200" fill="none" stroke="rgba(15, 23, 42, 0.22)" stroke-width="1.6"/>

    <!-- Hub to Mobile -->
    <path id="hm1" d="M 606 169 L 700 169" fill="none" stroke="#0d9488" stroke-width="1.8"/>
    <path id="hm2" d="M 700 185 L 606 185" fill="none" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="1.8"/>
  
    <circle r="3.5" fill="#0d9488" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mh1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
    <circle r="3.5" fill="#2563eb" filter="url(#glow)">
    <animateMotion dur="2.0s" begin="0.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mh2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.0s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
    <circle r="3.5" fill="#d97706" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="1.0s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mh3"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.2s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
    <circle r="3.8" fill="#0d9488" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="0.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#hm1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
    <circle r="3.8" fill="#7c3aed" filter="url(#glow)">
    <animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite" rotate="auto">
      <mpath href="#hm2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
  </circle>

    
    <g filter="url(#cardShadow)">
      <rect x="44" y="62" width="248" height="66" rx="12" fill="#ffffff" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1.2"/>
      <g>
    <circle cx="68" cy="95" r="4" fill="#0d9488"/>
    <circle cx="68" cy="95" r="4" fill="none" stroke="#0d9488" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
      <text x="88" y="91" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600">MacBook Pro</text>
      <text x="88" y="111" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12">本机开发 · 统筹调度</text>
    </g>
  

    <g filter="url(#cardShadow)">
      <rect x="44" y="146" width="248" height="66" rx="12" fill="#ffffff" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1.2"/>
      <g>
    <circle cx="68" cy="179" r="4" fill="#2563eb"/>
    <circle cx="68" cy="179" r="4" fill="none" stroke="#2563eb" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
      <text x="88" y="175" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600">Linux 开发机</text>
      <text x="88" y="195" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12">远程构建 · 算力节点</text>
    </g>
  

    <g filter="url(#cardShadow)">
      <rect x="44" y="230" width="248" height="66" rx="12" fill="#ffffff" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1.2"/>
      <g>
    <circle cx="68" cy="263" r="4" fill="#d97706"/>
    <circle cx="68" cy="263" r="4" fill="none" stroke="#d97706" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
      <text x="88" y="259" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600">Windows 主机</text>
      <text x="88" y="279" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12">环境测试 · 独立节点</text>
    </g>
  

    <!-- Unified Sidebar Hub -->
    <g filter="url(#hubShadow)">
      <rect x="390" y="128" width="216" height="98" rx="15" fill="url(#hubGrad)" stroke="#0d9488" stroke-width="1.6"/>
      <text x="498" y="170" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="700">统一侧栏调度</text>
      <text x="498" y="194" text-anchor="middle" fill="#0f766e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12.5">跨机会话互相调用</text>
    </g>

    <!-- Network badge below link -->
    <rect x="524" y="250" width="256" height="28" rx="14" fill="rgba(13, 148, 136, 0.1)" stroke="rgba(13, 148, 136, 0.25)" stroke-width="1"/>
    <text x="652" y="268" text-anchor="middle" fill="#0f766e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">局域网 / Tailscale / 加密 Relay</text>

    <!-- Mobile / Any Browser -->
    <g filter="url(#cardShadow)">
      <rect x="700" y="128" width="216" height="98" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="1.5"/>
      <g>
    <circle cx="726" cy="158" r="4" fill="#7c3aed"/>
    <circle cx="726" cy="158" r="4" fill="none" stroke="#7c3aed" stroke-width="1.5">
      <animate attributeName="r" values="4;11" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>
      <text x="814" y="170" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="700">手机 / 任意电脑</text>
      <text x="808" y="194" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="12.5">随时审批 · 追问 · 接力</text>
    </g>
  
</svg>
