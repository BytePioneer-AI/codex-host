services:
  relay:
    build:
      context: ../../..
      dockerfile: packages/remote-relay/Dockerfile
    restart: unless-stopped
    ports:
      - "443:443"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - relay-data:/data
    # Set the domain in .env next to this file: RELAY_DOMAIN=example.com
    command:
      [
        "--domain",
        "${RELAY_DOMAIN:?Set RELAY_DOMAIN in .env, for example RELAY_DOMAIN=example.com}",
      ]

volumes:
  relay-data:
