services:
  relay:
    build:
      context: ../../..
      dockerfile: packages/remote-relay/Dockerfile
    restart: unless-stopped
    ports:
      - "443:443"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - relay-data:/data
    command: ["--domain", "example.com"]

volumes:
  relay-data:
