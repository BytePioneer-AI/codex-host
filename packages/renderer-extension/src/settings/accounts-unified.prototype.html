    <template id="prototype-overrides"
      >/* Prototype-only overrides. The extracted production styles above remain unchanged. */
      .codexhost-settings-dialog { display: block; position: relative; margin: 22px auto; height:
      min(780px, calc(100dvh - 104px)); } .settings-page { overscroll-behavior: contain; }
      :host([data-view="unified"]) .settings-page__content { width: calc(100% - 64px); }
      :host([data-view="unified"]) .settings-account-header { align-items: center; gap: 16px; }
      :host([data-view="unified"]) .settings-account-header > .settings-command-button { margin-top:
      0; } :host([data-view="unified"]) .settings-page-description { margin-top: 7px; max-width:
      440px; } :host([data-view="unified"]) .settings-account-toolbar { margin-top: 23px; padding:
      16px 0; } :host([data-view="unified"]) .settings-account-toolbar input { width: 174px; }
      .unified-table { width: 100%; table-layout: fixed; border-collapse: collapse; } .unified-table
      col:nth-child(1) { width: 32%; } .unified-table col:nth-child(2), .unified-table
      col:nth-child(3) { width: 24%; } .unified-table col:nth-child(4) { width: 20%; }
      .unified-table th { padding: 12px 16px; background: light-dark(#f8f8fa, #252527); color:
      var(--settings-muted); text-align: left; font-size: 11px; font-weight: 500; } .unified-table
      th:last-child { text-align: right; padding-right: 20px; } .unified-table td { padding: 17px
      16px; border-top: 1px solid var(--settings-divider); vertical-align: middle; }
      .unified-row:hover { background: light-dark(#faf9fc, #242426); } .unified-person { display:
      grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 11px; }
      .unified-person > div:last-child { min-width: 0; } .unified-person .settings-account-email {
      display: block; font-size: 12px; } .unified-person .settings-account-metadata { gap: 5px;
      flex-wrap: wrap; font-size: 11px; } .unified-person .settings-account-plan { font-size: 10px;
      padding: 0 4px; } .unified-mark { display: grid; place-items: center; width: 34px; height:
      34px; flex: none; } .unified-mark img, .unified-mark svg { display: block; width: 26px;
      height: 26px; object-fit: contain; } .unified-mark.codex { color: light-dark(#67558d,
      #c3baff); background: light-dark(#f0ecf7, #353044); border: 1px solid light-dark(#d9d0e6,
      #4d435f); border-radius: 10px; } .unified-mark.codex svg { width: 17px; height: 17px; }
      .unified-default { color: light-dark(#66548e, #c8bfff); font-size: 10px; white-space: nowrap;
      } .unified-window { display: grid; grid-template-rows: 20px 4px 17px; gap: 6px; min-width: 0;
      font-variant-numeric: tabular-nums; } .unified-value { display: flex; align-items: baseline;
      justify-content: flex-end; min-width: 0; font-size: 14px; font-weight: 600; }
      .unified-reset-countdown { margin-right: 7px; color: var(--settings-muted); font-size: 10px;
      font-weight: 400; white-space: nowrap; } .unified-mobile-period { display: none; color:

              run() {
                toast("示例额度已刷新。");
              },
            },
          ];
          if (!account.protected)
            actions.push({
              label: "删除示例账号",
              danger: true,
              run() {
                dialog("删除示例账号？", "只从当前 HTML 内移除，不修改真实账号。", [
                  {
                    label: "确认删除",
                    danger: true,
                    run() {
                      if (account.active) accounts.find((a) => a.protected).active = true;
                      accounts.splice(accounts.indexOf(account), 1);
                      renderRows();
                      toast("示例账号已移除。");
                    },
                  },
                ]);
              },
            });
          dialog(
            "Codex 账号操作",
            `${account.email}${account.protected ? " 是受保护的原生账号，不提供删除。" : " · 以下操作只影响本原型。"}`,
            actions,
          );
        }
      });
      shadow.querySelector(".settings-nav").addEventListener("click", (event) => {
        const item = event.target.closest("button");
        if (item && item.dataset.pageId !== "accounts")
          toast("此原型仅用于审查账号页；其他设置页未接入。");
      });
      shadow
        .querySelector(".settings-header .settings-icon-button")
        .addEventListener("click", () => {
          windowElement.hidden = true;
          document.getElementById("reopen").hidden = false;
        });
      document.getElementById("reopen").addEventListener("click", () => {
        windowElement.hidden = false;
        document.getElementById("reopen").hidden = true;
      });
      for (const button of document.querySelectorAll("[data-review-view]"))
        button.addEventListener("click", () => {
          view = button.dataset.reviewView;
          query = "";
          setView();
        });
      document.getElementById("theme-toggle").addEventListener("click", () => {
        theme = theme === "light" ? "dark" : "light";
        applyTheme();
      });
      document.addEventListener("keydown", (event) => {
        const target = event.composedPath()[0];
        if (modal.open || target?.matches?.('input, textarea, select, [contenteditable="true"]'))
          return;
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          view = view === "unified" ? "original" : "unified";
          query = "";
          setView();
        }
      });
      setView();
      applyTheme();
    </script>
  </body>
</html>
