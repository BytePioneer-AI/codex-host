name: Submit a Desktop extension
description: Add a released Desktop UI extension to the codexhost catalog.
title: "[Desktop extension] "
body:
  - type: input
    id: repository
    attributes:
      label: GitHub repository URL
      description: Link to the public repository with a stable Release and a packaged extension ZIP.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
